# VS Code may show a false warning here because this workflow uses remote reusable workflow that defines its own inputs.

name: SLSA Provenance

on:
  workflow_run:
    workflows: ["Python CI"]
    types:
      - completed

permissions:
  id-token: write
  contents: write
  actions: read

jobs:
  generate-provenance:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_file_slsa3.yml@v2.0.0
    with:
      path: artifact-placeholder.txt