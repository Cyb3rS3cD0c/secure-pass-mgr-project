name: SLSA Provenance

on:
  workflow_run:
    workflows: ["Python CI"]
    types:
      - completed

permissions:
  id-token: write
  contents: write
  actions: read

jobs:
  generate-provenance:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.10.0
    with:
      base64-subjects: |
        $(echo "No artifacts yet" | base64 -w0)